<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Page not found | Renue Home</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .not-found{max-width:680px;margin:12vh auto;padding:32px 24px;color:#0f1a23;font-family:Arial,sans-serif;line-height:1.6}
    .not-found h1{font-size:clamp(28px,6vw,44px);line-height:1.2}
    .not-found a{color:#087e72;text-decoration:underline;text-underline-offset:3px}
    .not-found nav{display:flex;flex-wrap:wrap;gap:16px;margin-top:24px}
  </style>
</head>
<body>
  <main class="not-found">
    <a href="/">Renue Home</a>
    <h1>We could not find that page</h1>
    <p>The address may have changed, or this page may not have been published yet.</p>
    <nav aria-label="Find another page">
      <a href="/guides">Read our home improvement guides</a>
      <a href="/">Visit the homepage</a>
    </nav>
  </main>
</body>
</html>
